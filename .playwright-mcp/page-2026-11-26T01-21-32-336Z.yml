    - region "Persamaan fungsi keanggotaan (Bab 3.2)" [ref=f2e220]:
      - heading "Persamaan fungsi keanggotaan (Bab 3.2)" [level=2] [ref=f2e221]
      - generic [ref=f2e222]:
        - generic [ref=f2e223]:
          - heading "Suhu ruangan (x, 16-36 °C, ideal 23-26 °C)" [level=3] [ref=f2e224]
          - paragraph [ref=f2e225]: "Dingin [16, 16, 20, 24]: 1 (x <= 20); (24-x)/4 (20 < x < 24); 0 (x >= 24)"
          - paragraph [ref=f2e226]: "Nyaman [20, 24, 28]: (x-20)/4 (20 < x <= 24); (28-x)/4 (24 < x < 28)"
          - paragraph [ref=f2e227]: "Panas [24, 28, 36, 36]: (x-24)/4 (24 < x < 28); 1 (x >= 28)"
        - generic [ref=f2e228]:
          - heading "Kebisingan (y, 30-100 dB, ideal <= 55-65 dB)" [level=3] [ref=f2e229]
          - paragraph [ref=f2e230]: "Tenang [30, 30, 45, 65]: 1 (y <= 45); (65-y)/20 (45 < y < 65); 0 (y >= 65)"
          - paragraph [ref=f2e231]: "Sedang [45, 65, 85]: (y-45)/20 (45 < y <= 65); (85-y)/20 (65 < y < 85)"
          - paragraph [ref=f2e232]: "Bising [65, 85, 100, 100]: (y-65)/20 (65 < y < 85); 1 (y >= 85)"
        - generic [ref=f2e233]:
          - heading "Pencahayaan (z, 0-600 Lux, ideal >= 300 Lux)" [level=3] [ref=f2e234]
          - paragraph [ref=f2e235]: "Redup [0, 0, 150, 300]: 1 (z <= 150); (300-z)/150 (150 < z < 300); 0 (z >= 300)"
          - paragraph [ref=f2e236]: "Cukup [150, 300, 450]: (z-150)/150 (150 < z <= 300); (450-z)/150 (300 < z < 450)"
          - paragraph [ref=f2e237]: "Terang [300, 450, 600, 600]: (z-300)/150 (300 < z < 450); 1 (z >= 450)"
        - generic [ref=f2e238]:
          - heading "Skor kenyamanan (w, 0-100)" [level=3] [ref=f2e239]
          - paragraph [ref=f2e240]: "Tidak Nyaman [0, 0, 25, 50]: 1 (w <= 25); (50-w)/25 (25 < w < 50)"
          - paragraph [ref=f2e241]: "Cukup Nyaman [25, 50, 75]: (w-25)/25 (25 < w <= 50); (75-w)/25 (50 < w < 75)"
          - paragraph [ref=f2e242]: "Sangat Ideal [50, 75, 100, 100]: (w-50)/25 (50 < w < 75); 1 (w >= 75)"
