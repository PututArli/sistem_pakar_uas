    - region "Persamaan fungsi keanggotaan (Bab 3.2)" [ref=e263]:
      - heading "Persamaan fungsi keanggotaan (Bab 3.2)" [level=2] [ref=e264]
      - generic [ref=e265]:
        - generic [ref=e266]:
          - heading "Suhu ruangan (x, 16-36 °C, ideal 23-26 °C)" [level=3] [ref=e267]
          - paragraph [ref=e268]: "Dingin [16, 16, 20, 24]: 1 (x <= 20); (24-x)/4 (20 < x < 24); 0 (x >= 24)"
          - paragraph [ref=e269]: "Nyaman [20, 24, 28]: (x-20)/4 (20 < x <= 24); (28-x)/4 (24 < x < 28)"
          - paragraph [ref=e270]: "Panas [24, 28, 36, 36]: (x-24)/4 (24 < x < 28); 1 (x >= 28)"
        - generic [ref=e271]:
          - heading "Kebisingan (y, 30-100 dB, ideal <= 55-65 dB)" [level=3] [ref=e272]
          - paragraph [ref=e273]: "Tenang [30, 30, 45, 65]: 1 (y <= 45); (65-y)/20 (45 < y < 65); 0 (y >= 65)"
          - paragraph [ref=e274]: "Sedang [45, 65, 85]: (y-45)/20 (45 < y <= 65); (85-y)/20 (65 < y < 85)"
          - paragraph [ref=e275]: "Bising [65, 85, 100, 100]: (y-65)/20 (65 < y < 85); 1 (y >= 85)"
        - generic [ref=e276]:
          - heading "Pencahayaan (z, 0-600 Lux, ideal >= 300 Lux)" [level=3] [ref=e277]
          - paragraph [ref=e278]: "Redup [0, 0, 150, 300]: 1 (z <= 150); (300-z)/150 (150 < z < 300); 0 (z >= 300)"
          - paragraph [ref=e279]: "Cukup [150, 300, 450]: (z-150)/150 (150 < z <= 300); (450-z)/150 (300 < z < 450)"
          - paragraph [ref=e280]: "Terang [300, 450, 600, 600]: (z-300)/150 (300 < z < 450); 1 (z >= 450)"
        - generic [ref=e281]:
          - heading "Skor kenyamanan (w, 0-100)" [level=3] [ref=e282]
          - paragraph [ref=e283]: "Tidak Nyaman [0, 0, 25, 50]: 1 (w <= 25); (50-w)/25 (25 < w < 50)"
          - paragraph [ref=e284]: "Cukup Nyaman [25, 50, 75]: (w-25)/25 (25 < w <= 50); (75-w)/25 (50 < w < 75)"
          - paragraph [ref=e285]: "Sangat Ideal [50, 75, 100, 100]: (w-50)/25 (50 < w < 75); 1 (w >= 75)"
